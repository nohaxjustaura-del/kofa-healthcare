name: Refresh portfolio news

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-portfolio-news
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kofa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kofa/package-lock.json
      - run: npm ci
      - run: npm run test:news
      - run: npm run test:admin
      - run: npm run news:sync
      - run: npm run build
      - run: npm run typecheck
      - name: Commit refreshed snapshot
        working-directory: .
        shell: bash
        run: |
          git add -- kofa/data/news.generated.json
          if git diff --cached --quiet; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh portfolio news"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
